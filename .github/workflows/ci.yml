# Builds and tests every push and pull request on Arch Linux (what Omarchy
# runs), builds the Arch package, and releases every push to main: each one
# bumps VERSION (bin/release patch|minor), and once the build passes this
# tags v<VERSION> and publishes the GitHub release. A push that forgot the
# bump fails here.
#
# The jobs run side by side and the release waits for all of them. Arch
# containers install only what building and testing need, and a compiler
# cache carried between runs means a change recompiles only what it touched.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The package's other runtime dependencies (qt6-wayland, xdg-desktop-portal)
  # take no part in building or testing it.
  BUILD_DEPENDENCIES: qt6-base qt6-declarative qt6-multimedia qt6-svg ccache
  CCACHE_MAXSIZE: 300M

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version is the same everywhere
        run: |
          version="$(cat VERSION)"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION is not x.y.z: $version"; exit 1; }
          grep -qx "pkgver=$version" pkgbuild/PKGBUILD || { echo "pkgbuild/PKGBUILD pkgver does not match VERSION $version"; exit 1; }

      # ShellCheck comes with the runner; on Arch it would bring the whole
      # Haskell runtime along.
      - name: Lint shell scripts
        run: shellcheck bin/* src/setup-kokoros.sh src/setup-qwen.sh

  test:
    name: Build and test
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # The tests also read PDFs (poppler), export audio (ffmpeg), run a fake
      # Qwen worker (python) and draw the window (a font).
      - name: Install dependencies
        run: |
          sed -i 's/^#\?ParallelDownloads.*/ParallelDownloads = 16/' /etc/pacman.conf
          pacman -Syu --noconfirm --needed $BUILD_DEPENDENCIES poppler ffmpeg python ttf-dejavu

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-test-${{ github.sha }}
          restore-keys: ccache-test-

      - name: Build and test
        run: |
          export PATH="/usr/lib/ccache/bin:$PATH" CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          bin/test
          ccache --show-stats

  package:
    name: Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          sed -i 's/^#\?ParallelDownloads.*/ParallelDownloads = 16/' /etc/pacman.conf
          pacman -Syu --noconfirm --needed $BUILD_DEPENDENCIES

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-package-${{ github.sha }}
          restore-keys: ccache-package-

      # makepkg refuses to run as root, and sudo would reset PATH. The test
      # job has already run the tests, and the runtime dependencies that
      # only matter on a desktop aren't installed, hence --nocheck --nodeps.
      - name: Build the package
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          useradd -m builder
          mkdir -p "$CCACHE_DIR"
          chown -R builder:builder .
          sudo -u builder env PATH="/usr/lib/ccache/bin:$PATH" CCACHE_DIR="$CCACHE_DIR" CCACHE_MAXSIZE="$CCACHE_MAXSIZE" \
            sh -c 'cd pkgbuild && makepkg -f --noconfirm --nocheck --nodeps'
          ccache --show-stats

      - name: Smoke-test the command line
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          build/omareader version
          build/omareader skill > /dev/null
          build/omareader export --help > /dev/null
          build/omareader setup --dry-run || true
          build/omareader doctor --json || test $? -eq 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: pkgbuild/omareader-*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Release
    needs: [lint, test, package]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this commit is a new release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          fi
          # A rerun of the commit that was released has nothing left to do;
          # any other commit on main still naming that version was pushed
          # without bin/release, and every push to main must be a release.
          tagged="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)"
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "VERSION $version was already released from $tagged."
            echo "Every push to main is a release: bump it with bin/release patch or bin/release minor."
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.version.outputs.publish == 'true'
        with:
          name: package
          path: dist

      - name: Assemble the release
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git archive --format=tar.gz --prefix="omareader-$VERSION/" -o "dist/omareader-$VERSION.tar.gz" HEAD
          sum="$(sha256sum "dist/omareader-$VERSION.tar.gz" | cut -d' ' -f1)"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$sum/" pkgbuild/PKGBUILD.release.in > dist/PKGBUILD
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -la dist

      - name: Tag and publish
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "omareader $VERSION" \
            --generate-notes

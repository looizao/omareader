# Builds and tests every push and pull request on Arch Linux (what Omarchy
# runs), builds the Arch package and the Android app, and on main publishes a
# GitHub release whenever VERSION names a version that has no tag yet. A new
# release also goes to Play's internal testing track, and so does main when
# the workflow is run by hand with "play" ticked (docs/play.md).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      play:
        description: Send the Android app to Play internal testing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEPENDENCIES: >-
    git qt6-base qt6-declarative qt6-multimedia qt6-svg qt6-wayland
    xdg-desktop-portal poppler ffmpeg libsecret ttf-dejavu shellcheck python

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed $DEPENDENCIES

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version is the same everywhere
        run: |
          version="$(cat VERSION)"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION is not x.y.z: $version"; exit 1; }
          grep -qx "pkgver=$version" pkgbuild/PKGBUILD || { echo "pkgbuild/PKGBUILD pkgver does not match VERSION $version"; exit 1; }

      - name: Lint shell scripts
        run: shellcheck bin/* src/setup-kokoros.sh src/setup-qwen.sh

      # The Google desktop client's secret stays out of git (docs/sync.md);
      # the build reads it from this ignored file. Without the repository
      # secret, as on a fork, the build simply has no Google Drive.
      - name: Write the Google client secret
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            printf '%s' "$GOOGLE_CLIENT_SECRET" > GOOGLE_CLIENT_SECRET
          fi

      - name: Build
        run: bin/build

      - name: Test
        run: bin/test

      - name: Smoke-test the command line
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          build/omareader version
          build/omareader skill > /dev/null
          build/omareader export --help > /dev/null
          build/omareader sync --help > /dev/null
          build/omareader setup --dry-run || true
          build/omareader doctor --json || test $? -eq 1

  package:
    name: Arch package
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed $DEPENDENCIES namcap

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Google desktop client's secret stays out of git (docs/sync.md);
      # the build reads it from this ignored file. Without the repository
      # secret, as on a fork, the build simply has no Google Drive.
      - name: Write the Google client secret
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            printf '%s' "$GOOGLE_CLIENT_SECRET" > GOOGLE_CLIENT_SECRET
          fi

      # makepkg refuses to run as root.
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder:builder .
          sudo -u builder sh -c 'cd pkgbuild && makepkg -f --noconfirm'
          namcap pkgbuild/omareader-*.pkg.tar.zst || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: pkgbuild/omareader-*.pkg.tar.zst
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      # The version code counts the commits, so it needs the whole history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The runner comes with JDK 21 and the Android SDK; the Gradle wrapper
      # checks its download against the SHA-256 sum in its properties.
      - name: Test, lint and build the release APK
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          bin/android test
          bin/android build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: Release
    needs: [package, android]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this commit is a new release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.version.outputs.publish == 'true'
        with:
          name: package
          path: dist

      - name: Assemble the release
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git archive --format=tar.gz --prefix="omareader-$VERSION/" -o "dist/omareader-$VERSION.tar.gz" HEAD
          sum="$(sha256sum "dist/omareader-$VERSION.tar.gz" | cut -d' ' -f1)"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$sum/" pkgbuild/PKGBUILD.release.in > dist/PKGBUILD
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -la dist

      - name: Tag and publish
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "omareader $VERSION" \
            --generate-notes

  # Signs the bundle with the upload key and sends it to internal testing.
  # The key lives in the "play" environment, which only main can use, and the
  # Play API is reached through workload identity federation, so no Google
  # key is stored here. Until that is set up, the run stops after the signed
  # bundle, which is what the first, manual upload to Play needs.
  play:
    name: Play internal testing
    needs: [test, android, release]
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.android.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (needs.release.outputs.published == 'true' || (github.event_name == 'workflow_dispatch' && inputs.play))
    runs-on: ubuntu-latest
    environment: play
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build the signed bundle
        env:
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "The play environment has no upload key; see docs/play.md."
            exit 1
          fi
          export JAVA_HOME="$JAVA_HOME_21_X64"
          umask 077
          printf '%s' "$UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.p12"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.p12" "$UPLOAD_KEYSTORE_PASSWORD" "$UPLOAD_KEYSTORE_PASSWORD" \
            > android/keystore.properties
          bin/android bundle

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Sign in to Google
        id: google
        if: vars.PLAY_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Send it to internal testing
        if: vars.PLAY_SERVICE_ACCOUNT != ''
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: bin/android publish

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12" android/keystore.properties

# Builds and tests every push and pull request on Arch Linux (what Omarchy
# runs), builds the Arch package, and on main publishes a GitHub release
# whenever VERSION names a version that has no tag yet.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEPENDENCIES: >-
    git qt6-base qt6-declarative qt6-multimedia qt6-svg qt6-wayland
    xdg-desktop-portal poppler ttf-dejavu shellcheck

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed $DEPENDENCIES

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version is the same everywhere
        run: |
          version="$(cat VERSION)"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION is not x.y.z: $version"; exit 1; }
          grep -qx "pkgver=$version" pkgbuild/PKGBUILD || { echo "pkgbuild/PKGBUILD pkgver does not match VERSION $version"; exit 1; }

      - name: Lint shell scripts
        run: shellcheck bin/* src/setup-kokoros.sh

      - name: Build
        run: bin/build

      - name: Test
        run: bin/test

      - name: Smoke-test the command line
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          build/omareader version
          build/omareader skill > /dev/null
          build/omareader setup --dry-run || true
          build/omareader doctor --json || test $? -eq 1

  package:
    name: Arch package
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed $DEPENDENCIES namcap

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # makepkg refuses to run as root.
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder:builder .
          sudo -u builder sh -c 'cd pkgbuild && makepkg -f --noconfirm'
          namcap pkgbuild/omareader-*.pkg.tar.zst || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: pkgbuild/omareader-*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Release
    needs: package
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this commit is a new release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.version.outputs.publish == 'true'
        with:
          name: package
          path: dist

      - name: Assemble the release
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git archive --format=tar.gz --prefix="omareader-$VERSION/" -o "dist/omareader-$VERSION.tar.gz" HEAD
          sum="$(sha256sum "dist/omareader-$VERSION.tar.gz" | cut -d' ' -f1)"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$sum/" pkgbuild/PKGBUILD.release.in > dist/PKGBUILD
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -la dist

      - name: Tag and publish
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "omareader $VERSION" \
            --generate-notes
